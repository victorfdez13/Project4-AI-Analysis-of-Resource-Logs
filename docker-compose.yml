# Full-stack Docker Compose for the SpeedAdmin log-analysis system.
#
# Containers (per the project proposal container diagram):
#   - sqlserver      : real SpeedAdmin log datasets
#   - mongo          : saved analyses + chat history
#   - ai-service     : FastAPI; text-generation gateway backed by Ollama
#   - python-ai      : FastAPI; structured log analysis pipeline
#   - backend        : ASP.NET minimal API; orchestrates SQL + python-ai
#   - frontend       : React build served by nginx
#
# Start everything with:   docker compose up --build
# Stop with:               docker compose down
# Wipe DB volumes too:     docker compose down -v

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: project4-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_password123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - backend-net

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: project4-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "Your_strong_password123"
    volumes:
      - ./database/sqlserver/init:/scripts:ro
    network_mode: "service:sqlserver"
    command:
      - /bin/bash
      - /scripts/init-sqlserver.sh
    restart: "no"

  mongo:
    image: mongo:7.0
    container_name: project4-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mongodb123
      MONGO_INITDB_DATABASE: resource_logs
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/mongodb/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "admin",
          "--password",
          "mongodb123",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - backend-net

  ollama:
    image: ollama/ollama
    container_name: project4-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - backend-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: project4-ai-service
    environment:
      MONGO_URI: "mongodb://admin:mongodb123@mongo:27017"
      MONGO_DATABASE_NAME: "resource_logs"
      MONGO_DATASET1_COLLECTION: "dataset1_logs"
      MONGO_DATASET2_COLLECTION: "dataset2_logs"
      MONGO_SAVEDLOGS_DATABASE_NAME: "savedlogs"
      MONGO_SAVEDLOGS_COLLECTION: "saved_logs"
      SQLITE_DB_PATH: "/data/chat_history.db"
      LLM_PROVIDER: "ollama"
      OLLAMA_BASE_URL: "http://ollama:11434/v1"
      OLLAMA_MODEL: "llama3.2"
      CORS_ALLOW_ORIGINS: ""
    volumes:
      - ai_service_data:/data
    depends_on:
      mongo:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - backend-net

  python-ai:
    build:
      context: ./python_ai
      dockerfile: Dockerfile
    container_name: project4-python-ai
    environment:
      MONGO_URI: "mongodb://admin:mongodb123@mongo:27017"
      MONGO_DATABASE_NAME: "resource_logs"
      MONGO_DATASET1_COLLECTION: "dataset1_logs"
      MONGO_DATASET2_COLLECTION: "dataset2_logs"
      EXPLANATION_BACKEND: "remote"
      REMOTE_LLM_BASE_URL: "http://ai-service:8000/v1"
      REMOTE_LLM_MODEL: "llama3.2"
      REMOTE_LLM_API_KEY: ""
      REMOTE_LLM_TIMEOUT_SECONDS: "120"
      CORS_ALLOW_ORIGINS: ""
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "8010:8010"
    networks:
      - backend-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: project4-backend
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:5005"
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=master;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True;"
      ConnectionStrings__MongoDb: "mongodb://admin:mongodb123@mongo:27017"
      SqlServerDatasets__0: "DATASET1"
      SqlServerDatasets__1: "DATASET2"
      MongoSettings__DatabaseName: "savedlogs"
      MongoSettings__CollectionName: "saved_logs"
      AiService__BaseUrl: "http://ai-service:8000"
      PythonAiService__BaseUrl: "http://python-ai:8010"
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      ai-service:
        condition: service_started
      python-ai:
        condition: service_started
    ports:
      - "5005:5005"
    networks:
      - backend-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: "http://localhost:5005"
    container_name: project4-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - backend-net

volumes:
  sqlserver_data:
  mongo_data:
  ai_service_data:
  ollama_data:

networks:
  backend-net:
    driver: bridge
