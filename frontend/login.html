
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SpeedAdmin – Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:    #1a6e7e;
      --orange:  #e8651a;
      --blue:    #2563eb;
      --blue-hover: #1d4ed8;
      --text:    #1a1f2e;
      --muted:   #6b7280;
      --border:  #d1d5db;
      --bg:      #f0f4f8;
      --card:    #ffffff;
      --input-bg:#f9fafb;
      --link:    #2563eb;
      --radius:  10px;
      --shadow:  0 4px 24px rgba(0,0,0,.08), 0 1px 4px rgba(0,0,0,.04);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 44px 40px 36px;
      width: 100%;
      max-width: 420px;
      animation: fadeUp .45s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Logo ── */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 52px;
      height: 40px;
    }

    .logo-text {
      font-family: 'Nunito', sans-serif;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -.3px;
      line-height: 1;
    }

    .logo-text span.speed { color: #2d2d2d; }
    .logo-text span.admin { color: var(--orange); }

    /* ── Headings ── */
    h1 {
      text-align: center;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -.4px;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: .92rem;
      margin-bottom: 32px;
    }

    /* ── Form ── */
    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--input-bg);
      font-family: inherit;
      font-size: .95rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    input::placeholder { color: #9ca3af; }

    /* ── Password wrapper ── */
    .pw-wrap {
      position: relative;
    }

    .pw-wrap input { padding-right: 44px; }

    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 2px;
      display: flex;
      align-items: center;
    }

    .toggle-pw:hover { color: var(--text); }

    /* ── Row: remember + forgot ── */
    .row-extras {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: .875rem;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .remember input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--blue);
      cursor: pointer;
    }

    .forgot {
      color: var(--link);
      text-decoration: none;
      font-weight: 500;
    }

    .forgot:hover { text-decoration: underline; }

    /* ── Button ── */
    .btn-signin {
      width: 100%;
      padding: 14px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .18s, transform .1s, box-shadow .18s;
      box-shadow: 0 2px 10px rgba(37,99,235,.3);
      margin-bottom: 22px;
    }

    .btn-signin:hover {
      background: var(--blue-hover);
      box-shadow: 0 4px 16px rgba(37,99,235,.35);
    }

    .btn-signin:active { transform: scale(.98); }

    /* Loading spinner inside button */
    .btn-signin.loading {
      pointer-events: none;
      opacity: .8;
    }

    /* ── Sign up link ── */
    .signup-row {
      text-align: center;
      font-size: .875rem;
      color: var(--muted);
    }

    .signup-row a {
      color: var(--link);
      font-weight: 600;
      text-decoration: none;
    }

    .signup-row a:hover { text-decoration: underline; }

    /* ── Footer ── */
    footer {
      margin-top: 28px;
      font-size: .78rem;
      color: #9ca3af;
      text-align: center;
      animation: fadeUp .55s .1s ease both;
    }

    /* ── Error message ── */
    .error-msg {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: .85rem;
      margin-bottom: 16px;
    }

    .error-msg.show { display: block; }
  </style>
</head>
<body>

  <div class="card">

    <!-- Logo -->
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 48 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Left teal oval half -->
        <ellipse cx="20" cy="20" rx="16" ry="20" fill="#1a6e7e"/>
        <!-- Right orange oval half — clipped to right side -->
        <clipPath id="rightHalf">
          <rect x="20" y="0" width="28" height="40"/>
        </clipPath>
        <ellipse cx="28" cy="20" rx="16" ry="20" fill="#e8651a" clip-path="url(#rightHalf)"/>
        <!-- White divider curve between the two halves -->
        <path d="M20 0 C24 8, 24 32, 20 40" stroke="white" stroke-width="2.5" fill="none"/>
      </svg>
      <div class="logo-text">
        <span class="speed">Speed</span><span class="admin">Admin</span>
      </div>
    </div>

    <h1>Welcome</h1>
    <p class="subtitle">Sign in to your Speed Admin account</p>

    <!-- Error -->
    <div class="error-msg" id="errorMsg">Incorrect email or password. Please try again.</div>

    <!-- Form -->
    <form id="loginForm" novalidate>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@email.com" autocomplete="email" required/>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required/>
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Show/hide password">
            <!-- Eye icon -->
            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="row-extras">
        <label class="remember">
          <input type="checkbox" id="remember"/>
          Remember me
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="btn-signin" id="submitBtn">Sign in</button>

      <p class="signup-row">Don't have an account? <a href="#">Sign up here</a></p>

    </form>
  </div>

  <footer>&copy; 2026 Speed Admin. All rights reserved.</footer>

  <script>
    const form       = document.getElementById('loginForm');
    const submitBtn  = document.getElementById('submitBtn');
    const errorMsg   = document.getElementById('errorMsg');
    const togglePw   = document.getElementById('togglePw');
    const pwInput    = document.getElementById('password');

    // Toggle password visibility
    togglePw.addEventListener('click', () => {
      const isText = pwInput.type === 'text';
      pwInput.type = isText ? 'password' : 'text';
      togglePw.innerHTML = isText
        ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
             <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
             <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
             <line x1="1" y1="1" x2="23" y2="23"/>
           </svg>`
        : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
             <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
             <circle cx="12" cy="12" r="3"/>
           </svg>`;
    });

    // Form submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('show');

      const email    = document.getElementById('email').value.trim();
      const password = pwInput.value;

      if (!email || !password) {
        errorMsg.textContent = 'Please fill in all fields.';
        errorMsg.classList.add('show');
        return;
      }

      // Loading state
      submitBtn.classList.add('loading');
      submitBtn.textContent = 'Signing in…';

      // Simulate API call (replace with real fetch)
      await new Promise(r => setTimeout(r, 1200));

      // Demo: always show error (replace with real auth logic)
      submitBtn.classList.remove('loading');
      submitBtn.textContent = 'Sign in';
      errorMsg.textContent = 'Incorrect email or password. Please try again.';
      errorMsg.classList.add('show');
    });
  </script>
</body>
</html>
